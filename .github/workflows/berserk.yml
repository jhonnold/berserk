name: Berserk Validation
on:
  push:
  workflow_dispatch:

jobs:
  engine:
    name: Berserk on ${{matrix.os}} with clang-${{matrix.version}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-26.04]
        version: [21]

    steps:
    - name: Clone Berserk
      uses: actions/checkout@v4

    - name: Compile
      run: cd src && make build ARCH=avx2 CC=clang-${{matrix.version}}

    - name: Strict warnings
      run: |
        cd src
        clang-${{matrix.version}} -std=gnu11 -march=x86-64-v3 -fsyntax-only -Werror \
          -Wall -Wextra -Wshadow -Wstrict-prototypes -Wmissing-prototypes -Wmissing-variable-declarations \
          -Wwrite-strings -Wvla -Wcast-qual -DVERSION='"ci"' -DEVALFILE='"none"' *.c nn/*.c

    - name: Bench
      run: |
        bench=$(git show --summary | grep -Po '(?<=Bench: )[0-9]+?(?=$)')
        ./src/berserk bench > output
        real=$(grep 'Results:' output | grep -Po '(?<=[\s]{5})[0-9]+?(?= nodes)')
        if [[ "$bench" != "$real" ]]; then echo "got $real, expected $bench" && exit 1; fi

    - name: Install Expect
      run: sudo apt-get install -y expect

    - name: Perft Test
      run: ./tests/perft.sh 1>/dev/null

  clang-format-checking:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      # Pinned: the previous action ran clang-format 12, which cannot parse .clang-format and passed everything.
      # pyrrhic and incbin.h are vendored.
      - name: Check formatting
        run: |
          python3 -m venv /tmp/cf && /tmp/cf/bin/pip install -q clang-format==21.1.8
          /tmp/cf/bin/clang-format --dry-run --Werror \
            $(git ls-files 'src/*.c' 'src/*.h' | grep -v -e '^src/pyrrhic/' -e '^src/incbin.h$')
