name: Berserk Validation
on:
  push:
  workflow_dispatch:

jobs:
  engine:
    name: Berserk on ${{matrix.os}} with clang-${{matrix.version}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-26.04]
        version: [21]

    steps:
    - name: Clone Berserk
      uses: actions/checkout@v4

    - name: Compile
      run: cd src && make build ARCH=avx2 CC=clang-${{matrix.version}}

    - name: Bench
      run: |
        bench=$(git show --summary | grep -Po '(?<=Bench: )[0-9]+?(?=$)')
        ./src/berserk bench > output
        real=$(grep 'Results:' output | grep -Po '(?<=[\s]{5})[0-9]+?(?= nodes)')
        if [[ "$bench" != "$real" ]]; then echo "got $real, expected $bench" && exit 1; fi

    - name: Install Expect
      run: sudo apt-get install -y expect

    - name: Perft Test
      run: ./tests/perft.sh 1>/dev/null

  clang-format-checking:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: RafikFarhad/clang-format-github-action@v2.1.0
        with:
          sources: 'src/*.c,src/*.h'
